name: CyberPulse Daily Dispatch

on:
  schedule:
    - cron: '0 16 * * *' # Runs daily at 09:30 PM IST (16:00 UTC)
  workflow_dispatch:

permissions:
  contents: write # Required to auto-save users.txt back to your repository

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bot Script
        run: python bot.py

      - name: Commit and save updated users list
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add users.txt
          git commit -m "Auto-update registered users list [skip ci]" || exit 0
          git push
